name: CI

on:
  push:
    branches: [main]
  pull_request:

# ワークフローの権限は、コードを読むことだけにする（リポジトリの既定が変わっても広がらないように）
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # スクリプトの文法と、よくある誤り（shellcheck は ubuntu-latest に入っている）
      - run: for f in skills/*/scripts/*.sh; do bash -n "$f"; done
      - run: shellcheck -S warning skills/*/scripts/*.sh
      # プラグインの設定とテンプレートが、JSON・YAML として読めること
      - run: for f in .claude-plugin/*.json skills/*/assets/*.json; do jq empty "$f"; done
      - run: ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f) }' skills/setup/assets/dependabot.yml skills/setup/assets/workflows/*.yml .github/*.yml .github/workflows/*.yml
      # SKILL.md の先頭に name と description があり、name がディレクトリ名と一致すること
      - run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "$f: frontmatter がない"; exit 1; }
            grep -q '^name: ' "$f" && grep -q '^description: ' "$f" || { echo "$f: name か description がない"; exit 1; }
            grep -qx "name: $(basename "$(dirname "$f")")" "$f" || { echo "$f: name がディレクトリ名と違う"; exit 1; }
          done
